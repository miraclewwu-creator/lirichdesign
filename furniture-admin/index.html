<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/lirich-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/lirich-apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>家具素材管理 — LIRICH STUDIO</title>
    <link rel="stylesheet" href="../admin/admin.css?v=5" />
  </head>
  <body>
    <header class="admin-header">
      <a class="brand" href="/furniture.html">LIRICH STUDIO</a>
      <div>
        <a class="text-link" href="/admin/">项目素材</a>
        <span class="local-badge">仅限本机</span>
        <a class="text-link" href="/furniture.html" target="_blank">查看家具页 ↗</a>
      </div>
    </header>

    <main class="admin-shell">
      <aside class="project-sidebar">
        <div class="sidebar-heading">
          <div><p class="eyebrow">Content Manager</p><h1>家具素材</h1></div>
          <button class="new-project-button" id="new-item" type="button">＋ 新增家具</button>
        </div>
        <p class="project-order-help" id="order-status" role="status">点击眼睛隐藏或恢复家具；拖动或用箭头调整顺序。</p>
        <div class="project-list" id="item-list" aria-label="家具列表"></div>
      </aside>

      <section class="editor" aria-live="polite">
        <div class="editor-empty" id="editor-empty"><p>从左侧选择家具，或新建一个家具条目。</p></div>

        <form id="item-form" hidden>
          <div class="editor-topbar">
            <div>
              <p class="eyebrow">Furniture Editor</p>
              <h2 id="editor-title">编辑家具</h2>
              <p class="file-path" id="file-path"></p>
            </div>
            <div class="topbar-actions">
              <a class="secondary-button" id="preview-item" href="/furniture.html" target="_blank">预览页面 ↗</a>
              <button class="primary-button" type="submit">保存修改</button>
            </div>
          </div>

          <section class="panel">
            <div class="panel-heading"><h3>基本信息</h3><label class="toggle"><input id="published" type="checkbox" /><span>网站显示</span></label></div>
            <div class="fields-grid">
              <label>家具网址标识<input id="slug" required pattern="[a-z0-9][a-z0-9-]{0,79}" placeholder="lounge-chair-01" /></label>
              <label>家具名称<input id="title" required placeholder="Lounge Chair 01" /></label>
              <label>类别<input id="category" placeholder="Lounge Chairs" /></label>
              <label>系列<input id="collection" placeholder="LIRICH Collection" /></label>
              <label>设计年份<input id="year" placeholder="2026" /></label>
              <label>设计师<input id="designer" placeholder="LIRICH STUDIO" /></label>
              <label>尺寸<input id="dimensions" placeholder="W 760 × D 820 × H 740 mm" /></label>
              <label>材质<input id="materials" placeholder="Oak, linen, brass" /></label>
              <label class="span-2">家具说明<textarea id="description" rows="5"></textarea></label>
            </div>
          </section>

          <section class="panel media-panel">
            <div class="panel-heading media-heading">
              <div><h3>图片素材</h3><p>首张上传图片会自动成为封面；可随时重新设置封面和调整顺序。</p></div>
              <label class="upload-button">上传图片<input id="image-upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple /></label>
            </div>
            <div class="media-summary"><span>封面：<strong id="cover-label">未设置</strong></span></div>
            <div class="upload-progress" id="upload-progress" hidden></div>
            <div class="gallery-editor" id="gallery-editor"></div>
            <div class="gallery-empty" id="gallery-empty">还没有家具图片。点击“上传图片”开始添加。</div>
          </section>

          <div class="save-bar">
            <p id="save-status" role="status"></p>
            <button class="primary-button" type="submit">保存家具</button>
          </div>
        </form>
      </section>
    </main>

    <dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
      <form method="dialog">
        <p class="eyebrow">可恢复删除</p>
        <h2 id="delete-dialog-title">从网站移除这件家具？</h2>
        <p id="delete-dialog-copy"></p>
        <p class="delete-dialog-note">家具详情和原图会继续保留在本机内容库中，不会被永久删除。</p>
        <div class="delete-dialog-actions">
          <button class="secondary-button" type="submit" value="cancel">取消</button>
          <button class="danger-button" id="confirm-delete" type="button">从网站移除</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="furniture-admin.js?v=3"></script>
  </body>
</html>
